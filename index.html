          <div class="space-y-2 text-xs sm:text-sm">
            <label class="flex items-center gap-2 cursor-pointer font-medium text-amber-600 dark:text-amber-400">
              <input type="checkbox" id="popularFilter" class="rounded text-amber-500">
              <span>🔥 En Çok Kullanılanlar</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="feature-filter rounded text-blue-600" value="mobil">

            </label>
            <label class="flex items-center gap-2 cursor-pointer">

      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition flex flex-col justify-between relative";
        
        const featureBadges = item.features.map(f => {
          if (f === 'mobil') return '<span class="bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 text-[10px] px-1.5 py-0.5 rounded font-semibold">Mobil</span>';
          if (f === 'efatura') return '<span class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 text-[10px] px-1.5 py-0.5 rounded font-semibold">e-Fatura</span>';
          if (f === 'ucretsiz') return '<span class="bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200 text-[10px] px-1.5 py-0.5 rounded font-semibold">Ücretsiz Plan</span>';
          if (f === 'bulut') return '<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-[10px] px-1.5 py-0.5 rounded font-semibold">Bulut</span>';
          return '';
        }).join(' ');

        const popularBadge = item.popular 
          ? '<span class="bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200 text-[10px] font-bold px-1.5 py-0.5 rounded">🔥 Popüler</span>' 
          : '';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <h3 class="text-lg sm:text-xl font-bold">${item.name}</h3>
              <span class="bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300 text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap">${item.category}</span>
            </div>
            
            <div class="flex gap-1 mb-2.5 flex-wrap">
              ${popularBadge}
              ${featureBadges}
            </div>

            <p class="text-gray-600 dark:text-gray-300 text-xs sm:text-sm mb-3 line-clamp-2">${item.tagline}</p>

            <div class="space-y-1 mb-3 text-[11px] sm:text-xs">
              <div class="truncate"><strong class="text-green-600 dark:text-green-400">Artısı:</strong> ${item.pros[0]}</div>
              <div class="truncate"><strong class="text-red-600 dark:text-red-400">Eksi:</strong> ${item.cons[0]}</div>
            </div>

            <!-- Çok Küçük Fiyat Bilgisi (Kart Altı) -->
            <div class="bg-gray-50 dark:bg-gray-700/40 p-2 rounded-lg border dark:border-gray-700/60 mb-3 text-[10px] sm:text-[11px] flex justify-between items-center text-gray-500 dark:text-gray-400">
              <div>En Düşük: <span class="font-bold text-gray-700 dark:text-gray-200">${item.minPrice}</span></div>
              <div>Ort.: <span class="font-bold text-blue-600 dark:text-blue-400">${item.avgPrice}</span></div>
              <div>En Yüksek: <span class="font-bold text-gray-700 dark:text-gray-200">${item.maxPrice}</span></div>
            </div>
          </div>

          <!-- Alt Butonlar -->
          <div class="flex flex-col sm:flex-row justify-between items-center border-t dark:border-gray-700 pt-3 gap-2">
            <span class="text-yellow-500 font-bold text-xs sm:text-sm self-start sm:self-center">⭐ ${item.rating} / 5</span>
            <div class="flex gap-2 w-full sm:w-auto">
              <button onclick="openDetailPage('${item.id}')" class="flex-1 sm:flex-initial text-center px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition shadow-sm cursor-pointer">
                Detay ➔
              </button>
              <a href="${item.website}" target="_blank" class="flex-1 sm:flex-initial text-center px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition shadow-sm cursor-pointer">
                🛒 Satın Al
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // CAPTERRA TARZI TAM EKRAN DETAY SAYFASI
    function openDetailPage(softwareId) {
      const item = softwareData.find(s => s.id === softwareId);
      if (!item) return;

      const container = document.getElementById('detailPageContent');

      // Özellikler Listesi
      const featuresHtml = (item.detailedFeatures || []).map(f => `
        <div class="flex items-center gap-2 p-2.5 rounded-lg bg-gray-50 dark:bg-gray-700/50 text-xs sm:text-sm border dark:border-gray-600">
          <span class="${f.active ? 'text-green-500 font-bold text-sm' : 'text-red-400 font-bold'}">${f.active ? '✓' : '✕'}</span>
          <span class="${f.active ? 'text-gray-800 dark:text-gray-200 font-medium' : 'text-gray-400 line-through'}">${f.name}</span>
        </div>
      `).join('');

      // Artılar & Eksiler
      const prosHtml = item.pros.map(p => `<li class="flex items-start gap-2"><span>✅</span> <span>${p}</span></li>`).join('');
      const consHtml = item.cons.map(c => `<li class="flex items-start gap-2"><span>❌</span> <span>${c}</span></li>`).join('');

      container.innerHTML = `
        <!-- Üst Banner & Başlık Alanı -->
        <div class="bg-white dark:bg-gray-800 p-5 sm:p-8 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm mb-6 sm:mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <h1 class="text-2xl sm:text-3xl font-extrabold">${item.name}</h1>
              <span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-xs font-semibold px-2.5 py-0.5 rounded-full">${item.category}</span>
            </div>
            <p class="text-gray-600 dark:text-gray-300 text-sm sm:text-base mb-3">${item.tagline}</p>
            <div class="flex items-center gap-3 text-xs sm:text-sm">
              <span class="text-yellow-500 font-bold">⭐ ${item.rating} / 5.0</span>
              <span class="text-gray-300 dark:text-gray-600">•</span>
              <span class="text-gray-500 dark:text-gray-400 font-medium">${item.reviewCount || 50}+ Değerlendirme</span>
            </div>
          </div>

          <!-- Sağ Buton & Fiyat Kutusu -->
          <div class="bg-gray-50 dark:bg-gray-700/50 p-4 sm:p-5 rounded-xl border dark:border-gray-600 min-w-full md:min-w-[260px] text-center">
            <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">Başlangıç / Ortalama Fiyat</div>
            <div class="text-2xl sm:text-3xl font-extrabold text-blue-600 dark:text-blue-400 mb-1.5">${item.price}</div>
            <div class="text-xs text-green-600 dark:text-green-400 font-semibold mb-3">🎁 ${item.trial || 'Deneme Sürümü Var'}</div>
            <a href="${item.website}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl transition shadow">
              🛒 Hemen Satın Al / İncele ↗
            </a>
          </div>
        </div>

        <!-- Fiyat Seçenekleri Detay Kutusu -->
        <div class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm mb-6 sm:mb-8">
          <h3 class="font-bold text-base sm:text-lg mb-4 text-gray-800 dark:text-gray-100">💰 Detaylı Fiyat Aralıkları</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
            <div class="p-3.5 rounded-xl bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800/50 text-center">
              <div class="text-[10px] sm:text-xs text-green-700 dark:text-green-400 font-bold uppercase mb-0.5">En Düşük Fiyat</div>
              <div class="text-xl sm:text-2xl font-extrabold text-green-700 dark:text-green-300">${item.minPrice}</div>
              <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">Giriş seviyesi paketler</p>
            </div>
            <div class="p-3.5 rounded-xl bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/50 text-center">
              <div class="text-[10px] sm:text-xs text-blue-700 dark:text-blue-400 font-bold uppercase mb-0.5">Ortalama Fiyat</div>
              <div class="text-xl sm:text-2xl font-extrabold text-blue-700 dark:text-blue-300">${item.avgPrice}</div>
              <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">Genel kullanım / Standart paket</p>
            </div>
            <div class="p-3.5 rounded-xl bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800/50 text-center">
              <div class="text-[10px] sm:text-xs text-purple-700 dark:text-purple-400 font-bold uppercase mb-0.5">En Yüksek Fiyat</div>
              <div class="text-xl sm:text-2xl font-extrabold text-purple-700 dark:text-purple-300">${item.maxPrice}</div>
              <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">Gelişmiş / Kurumsal çözümler</p>
            </div>
          </div>
        </div>

        <!-- Detay İçerik Izgarası -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
          <div class="lg:col-span-2 space-y-6 sm:space-y-8">
            <section class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <h2 class="text-lg sm:text-xl font-bold mb-3 border-b dark:border-gray-700 pb-2">📝 Genel Bakış & Nedir?</h2>
              <p class="text-gray-600 dark:text-gray-300 leading-relaxed text-xs sm:text-sm">${item.overview}</p>
            </section>

            <section class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <h3 class="font-bold text-green-600 dark:text-green-400 text-sm sm:text-base mb-2.5">👍 Güçlü Yönleri (Artıları)</h3>
                <ul class="space-y-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300">${prosHtml}</ul>
              </div>
              <div>
                <h3 class="font-bold text-red-600 dark:text-red-400 text-sm sm:text-base mb-2.5">👎 Zayıf Yönleri (Eksileri)</h3>
                <ul class="space-y-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300">${consHtml}</ul>
              </div>
            </section>

            <section class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <h2 class="text-lg sm:text-xl font-bold mb-3 sm:mb-4 border-b dark:border-gray-700 pb-2">⚡ Modül & Özellik Listesi</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${featuresHtml}</div>
            </section>
          </div>

          <div class="space-y-5 sm:space-y-6">
            <div class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <h3 class="font-bold text-[10px] sm:text-xs uppercase text-gray-400 mb-1.5">🎯 Kimler İçin Uygundur?</h3>
              <p class="text-xs sm:text-sm font-semibold">${item.targetAudience}</p>
            </div>

            <div class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <h3 class="font-bold text-[10px] sm:text-xs uppercase text-gray-400 mb-2.5">💻 Platform Desteği</h3>
              <div class="flex flex-wrap gap-1.5">
                ${(item.platforms || ['Web']).map(p => `<span class="bg-gray-100 dark:bg-gray-700 text-xs px-2.5 py-1 rounded font-medium">${p}</span>`).join('')}
              </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <h3 class="font-bold text-[10px] sm:text-xs uppercase text-gray-400 mb-2.5">🎧 Destek Kanalları</h3>
              <ul class="space-y-1.5 text-xs sm:text-sm">
                ${(item.support || ['E-posta']).map(s => `<li class="flex items-center gap-2"><span class="text-blue-500 font-bold">✔</span> ${s}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mainPage').classList.add('hidden');
      document.getElementById('detailPage').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showMainPage() {
      document.getElementById('detailPage').classList.add('hidden');
      document.getElementById('mainPage').classList.remove('hidden');
    }

    // Filtreleme ve Sıralama Mantığı
    function filterSoftware() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('categoryFilter').value;
      const isPopularOnly = document.getElementById('popularFilter').checked;
      const sortValue = document.getElementById('sortFilter').value;
      
      const selectedFeatures = Array.from(document.querySelectorAll('.feature-filter:checked')).map(cb => cb.value);

      let filtered = softwareData.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchQuery) || 
                              item.category.toLowerCase().includes(searchQuery) ||
                              item.tagline.toLowerCase().includes(searchQuery);

        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const matchesFeatures = selectedFeatures.every(feat => item.features.includes(feat));
        const matchesPopular = !isPopularOnly || item.popular === true;

        return matchesSearch && matchesCategory && matchesFeatures && matchesPopular;
      });

      // Sıralama Mantığı
      if (sortValue === 'rating-desc') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (sortValue === 'rating-asc') {
        filtered.sort((a, b) => a.rating - b.rating);
      } else if (sortValue === 'min-price-asc') {
        filtered.sort((a, b) => a.minPriceVal - b.minPriceVal);
      } else if (sortValue === 'min-price-desc') {
        filtered.sort((a, b) => b.minPriceVal - a.minPriceVal);
      } else if (sortValue === 'avg-price-asc') {
        filtered.sort((a, b) => a.avgPriceVal - b.avgPriceVal);
      } else if (sortValue === 'avg-price-desc') {
        filtered.sort((a, b) => b.avgPriceVal - a.avgPriceVal);
      } else if (sortValue === 'max-price-asc') {
        filtered.sort((a, b) => a.maxPriceVal - b.maxPriceVal);
      } else if (sortValue === 'max-price-desc') {
        filtered.sort((a, b) => b.maxPriceVal - a.maxPriceVal);
      } else if (sortValue === 'name-asc') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      }

      renderCards(filtered);
    }

    // Olay Dinleyicileri (Event Listeners)
    document.getElementById('searchInput').addEventListener('input', filterSoftware);
    document.getElementById('categoryFilter').addEventListener('change', filterSoftware);
    document.getElementById('sortFilter').addEventListener('change', filterSoftware);
    document.getElementById('popularFilter').addEventListener('change', filterSoftware);
    
    document.querySelectorAll('.feature-filter').forEach(cb => {
      cb.addEventListener('change', filterSoftware);
    });

    document.getElementById('resetFilters').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = 'all';
      document.getElementById('sortFilter').value = 'default';
      document.getElementById('popularFilter').checked = false;
      document.querySelectorAll('.feature-filter').forEach(cb => cb.checked = false);
      filterSoftware();
    });

    // Koyu / Açık Tema Mantığı
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeBtn.innerText = isDark ? '☀️ Açık Tema' : '🌙 Koyu Tema';
    });

    // Sayfa Yüklendiğinde Kartları Listele
    renderCards(softwareData);
  </script>
</body>
</html>
