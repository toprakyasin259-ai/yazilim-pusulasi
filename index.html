<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazılım Pusulası - Keşfet & Karşılaştır</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Üst Menü / Header -->
  <header class="p-5 border-b bg-white dark:bg-gray-800 dark:border-gray-700 flex justify-between items-center shadow-sm sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🧭</span>
      <h1 class="text-2xl font-bold tracking-tight">Yazılım Pusulası</h1>
    </div>
    <button id="themeToggle" class="px-4 py-2 border rounded-lg bg-gray-100 dark:bg-gray-700 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-600 transition text-sm font-semibold">
      🌙 Koyu Tema
    </button>
  </header>

  <div class="max-w-7xl mx-auto p-6">
    <!-- Arama Çubuğu -->
    <div class="text-center my-6">
      <h2 class="text-3xl font-extrabold mb-2">İşletmeniz İçin En Doğru Yazılımı Keşfedin</h2>
      <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">İhtiyacınıza uygun yazılımları filtreleyin ve inceleyin.</p>
      
      <div class="max-w-xl mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Yazılım adı veya kelime arayın... (Örn: Paraşüt, Fatura)" 
          class="w-full p-4 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white"
        >
      </div>
    </div>

    <!-- Ana İçerik: Sol Filtre Paneli + Sağ Yazılım Kartları -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 mt-8">
      
      <!-- Sol Yan Panel: Filtreler -->
      <aside class="bg-white dark:bg-gray-800 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm h-fit">
        <div class="flex justify-between items-center mb-4 pb-2 border-b dark:border-gray-700">
          <h3 class="font-bold text-lg">Filtrele</h3>
          <button id="resetFilters" class="text-xs text-blue-600 dark:text-blue-400 hover:underline">Sıfırla</button>
        </div>

        <!-- Özellik Filtreleri (Checkbox) -->
        <div class="mb-6">
          <h4 class="font-semibold text-sm mb-3 text-gray-700 dark:text-gray-300">Öne Çıkan Özellikler</h4>
          <div class="space-y-2 text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="feature-filter rounded text-blue-600" value="mobil">
              <span>📱 Mobil Uygulama Var</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="feature-filter rounded text-blue-600" value="efatura">
              <span>🧾 e-Fatura Entegrasyonu</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="feature-filter rounded text-blue-600" value="ucretsiz">
              <span>🎁 Ücretsiz Deneme / Plan</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="feature-filter rounded text-blue-600" value="bulut">
              <span>☁️ Bulut Tabanlı</span>
            </label>
          </div>
        </div>

        <!-- Kategori Filtresi -->
        <div>
          <h4 class="font-semibold text-sm mb-3 text-gray-700 dark:text-gray-300">Kategoriler</h4>
          <select id="categoryFilter" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
            <option value="all">Tüm Kategoriler</option>
            <option value="Ön Muhasebe & Finans">Ön Muhasebe & Finans</option>
            <option value="E-Ticaret Altyapısı">E-Ticaret Altyapısı</option>
            <option value="İnsan Kaynakları">İnsan Kaynakları</option>
            <option value="CRM & Müşteri Takibi">CRM & Müşteri Takibi</option>
            <option value="Proje & Görev Yönetimi">Proje & Görev Yönetimi</option>
            <option value="Tasarım & İçerik">Tasarım & İçerik</option>
            <option value="Filo & Araç Yönetimi">Filo & Araç Yönetimi</option>
          </select>
        </div>
      </aside>

      <!-- Sağ Taraf: Yazılım Kartları Listesi -->
      <main class="lg:col-span-3">
        <div id="softwareList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Kartlar JavaScript ile yüklenecek -->
        </div>
      </main>

    </div>
  </div>

  <script>
    // 10 Adet Detaylı Yazılım Verisi
    const softwareData = [
      {
        id: "parasut",
        name: "Paraşüt",
        category: "Ön Muhasebe & Finans",
        tagline: "Küçük işletmeler için kolay e-Fatura, gelir-gider ve stok takibi.",
        pros: ["Kullanımı çok kolay", "Mobil uygulaması harika", "e-Fatura entegrasyonu hızlı"],
        cons: ["Büyük üretim tesisleri için karmaşık raporları eksik"],
        rating: 4.8,
        website: "https://www.parasut.com",
        features: ["mobil", "efatura", "bulut", "ucretsiz"]
      },
      {
        id: "ikas",
        name: "İkas",
        category: "E-Ticaret Altyapısı",
        tagline: "Hızlı ve modern altyapıyla kendi e-ticaret sitenizi dakikalar içinde kurun.",
        pros: ["Sayfa açılış hızları yüksek", "Kolay yönetim paneli", "Pazaryeri entegrasyonu"],
        cons: ["Başlangıç paket fiyatları biraz yüksek gelebilir"],
        rating: 4.7,
        website: "https://ikas.com",
        features: ["bulut", "ucretsiz"]
      },
      {
        id: "kolay-ik",
        name: "Kolay İK",
        category: "İnsan Kaynakları",
        tagline: "Çalışan izinleri, masrafları ve bordro süreçlerini tek ekrandan yönetin.",
        pros: ["Şık ve sade arayüz", "İzin takibini çok pratikleştiriyor"],
        cons: ["Muhasebe yazılımı olmadığı için fatura kesemezsiniz"],
        rating: 4.6,
        website: "https://kolayik.com",
        features: ["mobil", "bulut", "ucretsiz"]
      },
      {
        id: "teamgram",
        name: "TeamGram",
        category: "CRM & Müşteri Takibi",
        tagline: "Satış ekibinizin müşteri görüşmelerini ve teklif süreçlerini yönetin.",
        pros: ["Türkçe destek ekibi harika", "Teklif hazırlama özelliği pratik"],
        cons: ["Uluslararası büyük ekipler için özelleştirme imkanı sınırlı"],
        rating: 4.5,
        website: "https://www.teamgram.com",
        features: ["mobil", "bulut", "ucretsiz"]
      },
      {
        id: "logo-isbasi",
        name: "Logo İşbaşı",
        category: "Ön Muhasebe & Finans",
        tagline: "Cep telefonunuzdan saniyeler içinde e-Fatura ve e-SMM kesin.",
        pros: ["Logo güvencesi", "Mobil uygulaması çok hızlı"],
        cons: ["Gelişmiş stok analizi özellikleri sınırlı"],
        rating: 4.4,
        website: "https://isbasi.com",
        features: ["mobil", "efatura", "bulut"]
      },
      {
        id: "trello",
        name: "Trello",
        category: "Proje & Görev Yönetimi",
        tagline: "Kanban tahtaları ile projelerinizi ve günlük işlerinizi görselleştirin.",
        pros: ["Ücretsiz planı çok yeterli", "Sürükle-bırak kullanımı çok kolay"],
        cons: ["Çok büyük ve detaylı projelerde karmaşıklaşabiliyor"],
        rating: 4.7,
        website: "https://trello.com",
        features: ["mobil", "bulut", "ucretsiz"]
      },
      {
        id: "canva",
        name: "Tasarım & İçerik",
        category: "Tasarım & İçerik",
        tagline: "Sosyal medya görselleri, sunumlar ve afişler oluşturmak için grafik tasarım aracı.",
        pros: ["Binlerce hazır şablon", "Tasarım bilgisi gerektirmez"],
        cons: ["Profesyonel vektörel çizimler için yetersiz"],
        rating: 4.9,
        website: "https://www.canva.com",
        features: ["mobil", "bulut", "ucretsiz"]
      },
      {
        id: "zoho-crm",
        name: "Zoho CRM",
        category: "CRM & Müşteri Takibi",
        tagline: "Küresel ölçekte müşteri ilişkilerinizi ve satış kanallarınızı otomatikleştirin.",
        pros: ["Çok detaylı özelleştirme imkanı", "Yapay zeka desteği"],
        cons: ["Arayüzü ilk başlayanlar için karmaşık gelebilir"],
        rating: 4.5,
        website: "https://www.zoho.com/crm",
        features: ["mobil", "bulut", "ucretsiz"]
      },
      {
        id: "bulut-filo",
        name: "Bulut Filo",
        category: "Filo & Araç Yönetimi",
        tagline: "Şirket araçlarınızın bakım, ceza, kasko ve yakıt masraflarını kontrol edin.",
        pros: ["Araç başı maliyeti düşürür", "Bakım zamanı otomatik bildirim"],
        cons: ["Sadece filosu olan şirketlere özeldir"],
        rating: 4.3,
        website: "https://bulutfilo.com",
        features: ["bulut"]
      },
      {
        id: "iyzico",
        name: "iyzico",
        category: "E-Ticaret Altyapısı",
        tagline: "E-ticaret sitenizde güvenli sanal pos ve ödeme alma altyapısı.",
        pros: ["Kolay entegrasyon", "Ertesi gün ödeme alma seçeneği"],
        cons: ["İşlem başı komisyon oranları değişebilir"],
        rating: 4.8,
        website: "https://www.iyzico.com",
        features: ["efatura", "bulut"]
      }
    ];

    // Kartları Ekrana Çizme
    function renderCards(items) {
      const container = document.getElementById('softwareList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center text-gray-500 py-12 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700">Aradığınız filtre kriterlerine uygun yazılım bulunamadı.</div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition flex flex-col justify-between";
        
        // Rozet/Etiket Yapısı
        const featureBadges = item.features.map(f => {
          if (f === 'mobil') return '<span class="bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 text-[10px] px-2 py-0.5 rounded">Mobil</span>';
          if (f === 'efatura') return '<span class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 text-[10px] px-2 py-0.5 rounded">e-Fatura</span>';
          if (f === 'ucretsiz') return '<span class="bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200 text-[10px] px-2 py-0.5 rounded">Ücretsiz Plan</span>';
          if (f === 'bulut') return '<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-[10px] px-2 py-0.5 rounded">Bulut</span>';
          return '';
        }).join(' ');

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-xl font-bold">${item.name}</h3>
              <span class="bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300 text-xs px-2.5 py-1 rounded-full font-medium">${item.category}</span>
            </div>
            
            <div class="flex gap-1 mb-3 flex-wrap">
              ${featureBadges}
            </div>

            <p class="text-gray-600 dark:text-gray-300 text-sm mb-4">${item.tagline}</p>
            
            <div class="space-y-1.5 mb-4 text-xs">
              <div><strong class="text-green-600 dark:text-green-400">Artıları:</strong> ${item.pros.join(', ')}</div>
              <div><strong class="text-red-600 dark:text-red-400">Eksileri:</strong> ${item.cons.join(', ')}</div>
            </div>
          </div>

          <div class="flex justify-between items-center border-t dark:border-gray-700 pt-4 mt-2">
            <span class="text-yellow-500 font-bold text-sm">⭐ ${item.rating} / 5</span>
            <a href="${item.website}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">Siteye Git</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Ana Filtreleme Fonksiyonu
    function filterSoftware() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('categoryFilter').value;
      
      // Seçili Checkbox'ları Al
      const selectedFeatures = Array.from(document.querySelectorAll('.feature-filter:checked')).map(cb => cb.value);

      const filtered = softwareData.filter(item => {
        // 1. Arama Filtresi
        const matchesSearch = item.name.toLowerCase().includes(searchQuery) || 
                              item.category.toLowerCase().includes(searchQuery) ||
                              item.tagline.toLowerCase().includes(searchQuery);

        // 2. Kategori Filtresi
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;

        // 3. Özellik (Checkbox) Filtresi - Seçilen TÜM özelliklere sahip olmalı
        const matchesFeatures = selectedFeatures.every(feat => item.features.includes(feat));

        return matchesSearch && matchesCategory && matchesFeatures;
      });

      renderCards(filtered);
    }

    // Dinleyiciler (Event Listeners)
    document.getElementById('searchInput').addEventListener('input', filterSoftware);
    document.getElementById('categoryFilter').addEventListener('change', filterSoftware);
    
    document.querySelectorAll('.feature-filter').forEach(cb => {
      cb.addEventListener('change', filterSoftware);
    });

    // Filtreleri Sıfırla Butonu
    document.getElementById('resetFilters').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = 'all';
      document.querySelectorAll('.feature-filter').forEach(cb => cb.checked = false);
      filterSoftware();
    });

    // Koyu / Açık Tema Değişimi
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeBtn.innerText = isDark ? '☀️ Açık Tema' : '🌙 Koyu Tema';
    });

    // Sayfa açıldığında kartları göster
    renderCards(softwareData);
  </script>
</body>
</html>
